name: Build iOS (unsigned IPA)

# Ports the Windows build of AliceInCradle to iOS (Metal, IL2CPP arm64).
#
#   job "unity" -- self-hosted Windows runner (the owner's PC, where Unity
#                  2022.3.62f2 + iOS Build Support is installed and licensed)
#                  game-archive branch -> AssetRipper export -> shader/audio port
#                  -> Unity: iOS AssetBundles + Xcode project
#   job "ipa"   -- GitHub-hosted macOS runner with Xcode 26: unsigned .ipa
#
# The Windows build is downloaded part by part from the `game-archive` branch
# of this repository (archive/*.7z.part*, resumable, checksum-verified) and
# cached in <drive>\aicw-cache on the runner, or read from GAME_ARCHIVE_PATH.
#
# The runner must run as the Windows user that is signed in to Unity Hub
# (run.cmd, or the service configured with that account) so Unity finds the
# Personal license.
#
# Optional repository variables:
#   UNITY_EXE          full path to Unity.exe if it is not found automatically
#   GAME_ARCHIVE_PATH  path of AliceInCradle_Win_ver030i.7z on the runner (local
#                      disk or NAS share); skips the download
#   IOS_BUNDLE_ID      application identifier (default com.aliceincradle.iosport)
#   IOS_VERSION        CFBundleShortVersionString (default 0.30.9)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.62f2
  ASSETRIPPER_VERSION: 1.3.14
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.aliceincradle.iosport' }}
  APP_VERSION: ${{ vars.IOS_VERSION || '0.30.9' }}

jobs:
  unity:
    name: Port game & generate Xcode project (Windows PC)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 720
    defaults:
      run:
        shell: powershell
    env:
      UNITY_EXE: ${{ vars.UNITY_EXE }}
      PYTHONUTF8: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          $ErrorActionPreference = 'Stop'
          whoami
          if ((whoami) -match '^nt authority') {
            Write-Host "::warning::The runner runs as a system account; Unity will not find your Personal license. Run the runner as your own user."
          }
          # short work path (Unity/AssetRipper hit MAX_PATH with deep paths)
          $drive = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          $work = "$drive\aicw"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, "$work\logs" | Out-Null
          "WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_CACHE=$drive\aicw-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $unity = & "$env:GITHUB_WORKSPACE\tools\ci\find_unity.ps1" -Version $env:UNITY_VERSION
          if ($LASTEXITCODE -ne 0 -or -not $unity) { exit 1 }
          "UNITY=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Unity: $unity"
          $ios = Join-Path (Split-Path $unity) 'Data\PlaybackEngines\iOSSupport'
          if (-not (Test-Path $ios)) { throw "iOS Build Support is not installed for this editor ($ios)" }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install tools
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -q -r tools/requirements.txt
          # cached next to the game archive; curl resumes interrupted downloads
          New-Item -ItemType Directory -Force -Path "$env:ARCHIVE_CACHE" | Out-Null
          function Fetch([string]$url, [string]$name) {
            $dest = Join-Path $env:ARCHIVE_CACHE $name
            if (-not (Test-Path $dest)) {
              & curl.exe -fL --no-progress-meter --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 30 -C - -o "$dest.part" $url
              if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
              Move-Item "$dest.part" $dest
            }
            return $dest
          }
          Copy-Item (Fetch 'https://www.7-zip.org/a/7zr.exe' '7zr.exe') "$env:WORK\7zr.exe"
          $ar = Fetch "https://github.com/AssetRipper/AssetRipper/releases/download/$env:ASSETRIPPER_VERSION/AssetRipper_win_x64.zip" "AssetRipper_$env:ASSETRIPPER_VERSION.zip"
          Expand-Archive $ar -DestinationPath "$env:WORK\assetripper"

      - name: Get game archive
        env:
          GAME_ARCHIVE_PATH: ${{ vars.GAME_ARCHIVE_PATH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = & tools/ci/fetch_archive.ps1 -Out "$env:ARCHIVE_CACHE" -LocalPath "$env:GAME_ARCHIVE_PATH" -Repo "$env:GITHUB_REPOSITORY" | Select-Object -Last 1
          if (-not $archive -or -not (Test-Path -LiteralPath $archive)) { throw 'game archive not available' }
          "GAME_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Unpack game
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:WORK\7zr.exe" x -y "-o$env:WORK\game" "$env:GAME_ARCHIVE" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $data = Get-ChildItem "$env:WORK\game" -Recurse -Directory -Filter '*_Data' | Select-Object -First 1
          if (-not $data) { throw 'no *_Data folder in archive' }
          "GAME_DATA=$($data.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GAME_ROOT=$($data.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content (Join-Path $data.FullName 'app.info')

      - name: Build managed replacements (CRI audio, file dialogs) and tools
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build managed/CriMw.CriWare.Runtime -c Release "-p:UnityManaged=$env:GAME_DATA\Managed" -o "$env:WORK\dlls"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build managed/SFB -c Release -o "$env:WORK\dlls"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build tools/PortTool -c Release -o "$env:WORK\porttool"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pt = "$env:WORK\porttool\PortTool.dll"
          dotnet $pt md4-selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:WORK\refcheck" | Out-Null
          Copy-Item "$env:GAME_DATA\Managed\*.dll" "$env:WORK\refcheck\"
          Copy-Item "$env:WORK\dlls\CriMw.CriWare.Runtime.dll", "$env:WORK\dlls\SFB.dll" "$env:WORK\refcheck\" -Force
          # every reference the game makes into the replaced assemblies must resolve
          dotnet $pt check-refs "$env:WORK\refcheck" CriMw.CriWare.Runtime Assembly-CSharp unsafeAssem
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet $pt check-refs "$env:WORK\refcheck" SFB Assembly-CSharp unsafeAssem
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:WORK\refcheck" -Recurse -Force

      - name: Regenerate shaders for Metal
        run: |
          python tools/shaderport/port_shaders.py "$env:GAME_DATA" "$env:WORK\shaders"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Export game project with AssetRipper
        run: |
          & tools/ci/run_assetripper.ps1 -AssetRipper "$env:WORK\assetripper" -Game "$env:GAME_ROOT" -Out "$env:WORK\export"

      - name: Resolve Unity packages
        run: |
          Copy-Item unity "$env:WORK\unity" -Recurse
          & tools/ci/run_unity.ps1 -Unity "$env:UNITY" -Log "$env:WORK\logs\unity-resolve.log" -- -quit -projectPath "$env:WORK\unity" -buildTarget iOS
          if (-not (Test-Path "$env:WORK\unity\Library\PackageCache")) { throw 'package resolution failed (see unity-resolve.log)' }

      - name: Merge exported game into the iOS project
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/prepare_project.py --export "$env:WORK\export\ExportedProject" --project "$env:WORK\unity" --game-data "$env:GAME_DATA" --dlls "$env:WORK\dlls" --shaders "$env:WORK\shaders" --work "$env:WORK\prep"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:WORK\export", "$env:WORK\assetripper", "$env:WORK\ar.zip" -Recurse -Force
          $builtin = Join-Path (Split-Path $env:UNITY) 'Data\Resources\PackageManager\BuiltInPackages'
          $asms = Get-Content "$env:WORK\prep\package_assemblies.txt" | Where-Object { $_ }
          dotnet "$env:WORK\porttool\PortTool.dll" remap-scripts "$env:WORK\unity\Assets" "$env:WORK\unity\Library\PackageCache;$builtin" @asms
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($a in $asms) { Remove-Item "$env:WORK\unity\Assets\Plugins\$a.dll", "$env:WORK\unity\Assets\Plugins\$a.dll.meta" -ErrorAction SilentlyContinue }
          Get-ChildItem "$env:WORK\unity\Assets\Plugins" -Filter *.dll | Select-Object Name

      - name: Unity build (iOS AssetBundles + Xcode project)
        run: |
          & tools/ci/run_unity.ps1 -Unity "$env:UNITY" -Log "$env:WORK\logs\unity-build.log" -- -projectPath "$env:WORK\unity" -buildTarget iOS -executeMethod IOSPort.EditorTools.PortBuild.Build -portManifests "$env:WORK\prep\manifests" -portShaderMap "$env:WORK\prep\shader_map.tsv" -portOutput "$env:WORK\xcode" -portBundleId "$env:BUNDLE_ID" -portVersion "$env:APP_VERSION" -portBuildNumber "${{ github.run_number }}"
          if (-not (Test-Path "$env:WORK\xcode\Unity-iPhone.xcodeproj")) { throw 'Xcode project was not generated (see unity-build.log)' }

      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:WORK\logs\*" logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:WORK\export.log" logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:WORK\shaders\index.json" logs\ -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: logs
          if-no-files-found: ignore

      - name: Pack Xcode project
        run: |
          tar -cf "$env:WORK\xcode.tar" -C "$env:WORK" xcode
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "$env:WORK\xcode.tar" xcode.tar -Force
          Get-Item xcode.tar | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode.tar
          retention-days: 2

  ipa:
    name: Build unsigned IPA (Xcode 26)
    needs: unity
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Extract project
        run: |
          tar -xf xcode.tar
          rm xcode.tar
          df -h .

      - name: Archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project xcode/Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/AliceInCradle.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO COMPILER_INDEX_STORE_ENABLE=NO \
            archive | tee xcodebuild.log | grep -E "error:|warning: unable|ARCHIVE (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/AliceInCradle.xcarchive/Products/Applications

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AliceInCradle.xcarchive/Products/Applications/*.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/*.app/Info.plist)
          zip -qry "AliceInCradle-${VERSION}-unsigned.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AliceInCradle-unsigned-ipa
          path: "*.ipa"
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
